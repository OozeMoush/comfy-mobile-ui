approval_policy = "never"
default_permissions = "comfy-local"

[features]
network_proxy = true

[permissions.comfy-local]
description = "Workspace-only filesystem access with loopback-only command networking for local ComfyUI verification."
extends = ":workspace"

[permissions.comfy-local.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "deny"
":slash_tmp" = "deny"

[permissions.comfy-local.network]
enabled = true

[permissions.comfy-local.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
